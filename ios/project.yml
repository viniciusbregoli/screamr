name: ScreamrMobile
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: HQBG3ZNH46
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Screamr:
    type: application
    platform: iOS
    sources:
      - Screamr
      # Shared with the Mac app: Scribe client, transcript rendering and the Mocha palette.
      - path: ../Sources/Screamr/Scribe.swift
      - path: ../Sources/Screamr/Transcript.swift
      - path: ../Sources/Screamr/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screamr.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Screamr/Info.plist
      properties:
        CFBundleDisplayName: screamr
        NSMicrophoneUsageDescription: screamr records meetings so they can be transcribed.
        # Keeps recording with the screen locked.
        UIBackgroundModes: [audio]
        # Recordings and transcripts show up in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
